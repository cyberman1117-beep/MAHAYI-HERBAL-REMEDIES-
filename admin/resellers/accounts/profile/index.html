<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Manage an individual MAHAYI HERBAL REMEDIES reseller account."><title>Reseller Profile | MAHAYI HERBAL REMEDIES Admin</title><link rel="stylesheet" href="../../../../assets/css/styles.css"><script type="module" src="../../../../assets/js/firebase-auth.js"></script><script src="../../../../assets/js/site.js" defer></script></head>
<body class="admin-page"><a class="skip-link" href="#main">Skip to content</a><header class="admin-header"><div class="container header-inner"><a class="brand" href="/admin/">MAHAYI HERBAL REMEDIES <span class="admin-label">Admin</span></a><div class="admin-account"><span data-admin-account>Admin account</span><button class="button button-small button-outline" type="button" data-admin-logout>Log out</button></div></div></header>
<main id="main" class="admin-main"><div class="container"><div class="settings-heading"><div><p class="eyebrow">Reseller account management</p><h1 id="profile-title">Reseller Profile</h1><p class="muted" id="profile-subtitle">Manage approval, suspension and distributor privileges for this account.</p></div><a class="button button-outline" href="/admin/resellers/accounts/">← Back to all accounts</a></div><p id="profile-status" class="settings-load-status" role="status">Loading reseller profile…</p><div id="profile-content"></div></div></main><footer class="site-footer"><div class="container footer-inner"><a class="brand" href="/admin/">MAHAYI HERBAL REMEDIES</a><p>© <span data-current-year>2026</span> MAHAYI HERBAL REMEDIES</p></div></footer>
<script type="module">
const status=document.querySelector('#profile-status'),content=document.querySelector('#profile-content'),title=document.querySelector('#profile-title'),subtitle=document.querySelector('#profile-subtitle');
const id=new URLSearchParams(location.search).get('id');
async function api(resource,id,method='GET',body){if(typeof window.getAdminIdToken!=='function')throw Error('Admin authentication is still loading.');const token=await window.getAdminIdToken();const u=new URL('/api/admin-reseller-management',location.origin);u.searchParams.set('resource',resource);if(id)u.searchParams.set('id',id);const r=await fetch(u,{method,headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const p=await r.json().catch(()=>({}));if(!r.ok||!p.success)throw Error(p.error||'Request failed.');return p;}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function labelStatus(s){return ({pending:'Pending approval',active:'Approved / active',suspended:'Suspended',rejected:'Rejected'})[s]||s||'Unknown';}
function render(a){
 title.textContent=a.full_name||'Reseller profile';subtitle.textContent=(a.email||'No email')+' · '+(a.phone||'No phone');
 const card=document.createElement('section');card.className='settings-panel';
 card.innerHTML='<div class="settings-heading"><div><p class="eyebrow">Individual reseller account</p><h2>'+esc(a.full_name||'Unnamed applicant')+'</h2><p class="muted">'+esc(a.email||'No email')+' · '+esc(a.phone||'No phone')+'</p></div><span class="admin-status">'+esc(labelStatus(a.status))+'</span></div><div class="settings-fields settings-fields-two"><div><p><strong>Account ID:</strong> '+esc(a.id)+'</p><p><strong>Applied:</strong> '+esc(a.created_at||'Unknown')+'</p><p><strong>Approved:</strong> '+esc(a.approved_at||'Not approved')+'</p><p><strong>Last updated:</strong> '+esc(a.updated_at||'Unknown')+'</p></div><div><p><strong>Pay-later privilege:</strong> '+(Number(a.pay_later_enabled)===1?'Enabled':'Not enabled')+'</p><p><strong>Pay-later approved:</strong> '+esc(a.pay_later_approved_at||'Not approved')+'</p></div></div><hr><form class="settings-form"><div class="settings-fields settings-fields-two"><label class="field"><span>Account status</span><select name="status"><option value="pending">Pending review</option><option value="active">Approved / active</option><option value="suspended">Suspended</option><option value="rejected">Rejected</option></select></label><label class="field"><span><input name="pay_later_enabled" type="checkbox"> Authorise restricted pay-later privilege</span><small class="muted">Only enable this for approved distributors authorised by M.H.R. Normal resellers pay upfront.</small></label><label class="field field-wide"><span>Admin notes</span><textarea name="notes" rows="4" maxlength="4000"></textarea></label><label class="field field-wide"><span>Pay-later terms / approval notes</span><textarea name="pay_later_notes" rows="3" maxlength="4000"></textarea></label></div><div class="settings-actions"><span class="settings-load-status" role="status">Unsaved changes</span><button class="button button-primary" type="submit">Save account changes</button></div></form>';
 const form=card.querySelector('form');form.elements.status.value=a.status;form.elements.pay_later_enabled.checked=Number(a.pay_later_enabled)===1;form.elements.notes.value=a.notes||'';form.elements.pay_later_notes.value=a.pay_later_notes||'';
 form.elements.status.addEventListener('change',()=>{if(form.elements.status.value!=='active')form.elements.pay_later_enabled.checked=false;});
 form.addEventListener('submit',async e=>{e.preventDefault();const button=e.submitter,notice=form.querySelector('[role=status]');button.disabled=true;notice.textContent='Saving…';try{await api('accounts',a.id,'PUT',{status:form.elements.status.value,pay_later_enabled:form.elements.pay_later_enabled.checked,notes:form.elements.notes.value,pay_later_notes:form.elements.pay_later_notes.value});notice.textContent='Saved successfully.';await load();}catch(err){notice.textContent=err.message;}finally{button.disabled=false;}});
 content.replaceChildren(card);
}
async function load(){if(!id){status.textContent='No reseller account was selected. Return to the account list and open a reseller.';return;}status.textContent='Loading reseller profile…';try{const p=await api('accounts');const a=(p.data.accounts||[]).find(x=>String(x.id)===String(id));if(!a)throw Error('This reseller account was not found in the account list.');status.textContent='';render(a);}catch(e){status.textContent=e.message;}}
await load();
</script></body></html>
