<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Local Delivery Options | Clothing Store Admin</title><link rel="stylesheet" href="../../assets/css/styles.css"><script type="module" src="../../assets/js/firebase-auth.js"></script><script src="../../assets/js/site.js" defer></script></head><body class="admin-page"><header class="admin-header"><div class="container header-inner"><a class="brand" href="../../index.html">Clothing Store <span class="admin-label">Admin</span></a><div class="admin-account"><span data-admin-account>Admin account</span><button class="button button-small button-outline" data-admin-logout>Log out</button></div></div></header><main class="admin-main"><div class="container"><div class="settings-heading"><div><p class="eyebrow">Shipping configuration</p><h1>Local Delivery Options</h1><p class="muted">Configure customer-facing delivery services and prices.</p></div><a class="button button-outline" href="./index.html">Back to Shipping</a></div><section class="settings-panel"><form class="settings-form" data-form><div class="settings-fields settings-fields-two"><label class="field"><span>Shipping provider</span><select name="shipping_method_id" required></select></label><label class="field"><span>Option / area name</span><input name="name" required maxlength="160"></label><label class="field"><span>Price (ZAR)</span><input name="price" type="number" min="0" step=".01" required value="0"></label><label class="field" data-landmark><span><input name="requires_landmark" type="checkbox"> Ask customer where they are staying / what they are near</span></label></div><div class="settings-actions"><span class="settings-load-status" data-status>Ready.</span><button class="button button-primary">Add option</button></div></form><div class="admin-sections" data-list></div></section></div></main><script>
async function getToken(){for(let i=0;i<50;i++){if(typeof window.getAdminIdToken==='function'){try{const t=await window.getAdminIdToken();if(t)return t;}catch(e){}}await new Promise(r=>setTimeout(r,200));}throw Error('Authentication required.');}async function api(u,o={}){const h=new Headers(o.headers||{});h.set('Authorization','Bearer '+await getToken());if(o.body)h.set('Content-Type','application/json');const r=await fetch(u,{...o,headers:h}),p=await r.json().catch(()=>({}));if(!r.ok||!p.success)throw Error(p.error||'Request failed.');return p;}const list=document.querySelector('[data-list]'),form=document.querySelector('[data-form]'),select=form.elements.shipping_method_id,status=document.querySelector('[data-status]'),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let methods=[];function sync(){const m=methods.find(x=>String(x.id)===String(select.value)),local=m?.provider_type==='local';form.elements.requires_landmark.disabled=!local;document.querySelector('[data-landmark]').hidden=!local;if(!local)form.elements.requires_landmark.checked=false;}async function load(){try{const p=await api('/api/shipping?include_disabled=1');methods=p.data||[];select.innerHTML=methods.map(m=>'<option value="'+m.id+'">'+esc(m.name)+'</option>').join('');sync();list.innerHTML=methods.flatMap(m=>(m.options||[]).map(o=>'<section class="admin-panel"><div><h2>'+esc(o.name)+'</h2><p class="muted">'+esc(m.name)+' · ZAR '+Number(o.price).toFixed(2)+(m.provider_type==='local'&&Number(o.requires_landmark)?' · Landmark required':'')+'</p></div><button class="button button-outline" data-id="'+o.id+'">Delete</button></section>')).join('')||'<p class="muted">No delivery options configured yet.</p>';}catch(e){status.textContent=e.message;}}select.addEventListener('change',sync);list.addEventListener('click',async e=>{const id=e.target.closest('[data-id]')?.dataset.id;if(!id||!confirm('Delete this shipping option?'))return;try{await api('/api/shipping?resource=option&id='+id,{method:'DELETE'});load();}catch(x){status.textContent=x.message;}});form.addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/shipping',{method:'POST',body:JSON.stringify({shipping_method_id:Number(select.value),name:form.elements.name.value.trim(),price:Number(form.elements.price.value||0),requires_landmark:form.elements.requires_landmark.checked,is_enabled:true})});form.reset();form.elements.price.value='0';status.textContent='Shipping option added.';load();}catch(x){status.textContent=x.message;}});load();
</script></body></html>
