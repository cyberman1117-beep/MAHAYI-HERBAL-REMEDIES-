<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shipping Providers | Clothing Store Admin</title><link rel="stylesheet" href="../../assets/css/styles.css"><script type="module" src="../../assets/js/firebase-auth.js"></script><script src="../../assets/js/site.js" defer></script></head><body class="admin-page"><header class="admin-header"><div class="container header-inner"><a class="brand" href="../../index.html">Clothing Store <span class="admin-label">Admin</span></a><div class="admin-account"><span data-admin-account>Admin account</span><button class="button button-small button-outline" data-admin-logout>Log out</button></div></div></header><main class="admin-main"><div class="container"><div class="settings-heading"><div><p class="eyebrow">Shipping configuration</p><h1>Shipping Providers</h1><p class="muted">Manage available delivery providers and integrations.</p></div><a class="button button-outline" href="./index.html">Back to Shipping</a></div><section class="settings-panel"><div class="admin-sections" data-list></div><p class="settings-load-status" data-status>Loading…</p></section></div></main><script>
async function getToken(){for(let i=0;i<50;i++){if(typeof window.getAdminIdToken==='function'){try{const t=await window.getAdminIdToken();if(t)return t;}catch(e){}}await new Promise(r=>setTimeout(r,200));}throw Error('Authentication required.');}async function api(u,o={}){const h=new Headers(o.headers||{});h.set('Authorization','Bearer '+await getToken());if(o.body)h.set('Content-Type','application/json');const r=await fetch(u,{...o,headers:h}),p=await r.json().catch(()=>({}));if(!r.ok||!p.success)throw Error(p.error||'Request failed.');return p;}const list=document.querySelector('[data-list]'),status=document.querySelector('[data-status]'),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){try{const p=await api('/api/shipping?include_disabled=1'),a=p.data||[];list.innerHTML=a.map(m=>{const cs=['courier_guy','postnet','bobgo'].includes(m.provider_type);return '<section class="admin-panel"><div><h2>'+esc(m.name)+'</h2><p class="muted">'+(m.mode==='api'?'API':'Manual')+' · '+(cs?'Coming soon':(Number(m.is_enabled)?'Enabled':'Disabled'))+'</p></div>'+(cs?'<span class="button button-outline">Coming soon</span>':'<button class="button button-outline" data-id="'+m.id+'">'+(Number(m.is_enabled)?'Disable':'Enable')+'</button>')+'</section>';}).join('');status.textContent='Shipping providers loaded.';}catch(e){status.textContent=e.message;}}list.addEventListener('click',async e=>{const id=e.target.closest('[data-id]')?.dataset.id;if(!id)return;try{const p=await api('/api/shipping?include_disabled=1'),m=(p.data||[]).find(x=>String(x.id)===String(id));await api('/api/shipping?resource=method&id='+id,{method:'PUT',body:JSON.stringify({is_enabled:Number(m.is_enabled)!==1})});load();}catch(x){status.textContent=x.message;}});load();
</script></body></html>
