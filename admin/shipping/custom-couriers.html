<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Custom Couriers | Clothing Store Admin</title><link rel="stylesheet" href="../../assets/css/styles.css"><script type="module" src="../../assets/js/firebase-auth.js"></script><script src="../../assets/js/site.js" defer></script></head><body class="admin-page"><header class="admin-header"><div class="container header-inner"><a class="brand" href="../../index.html">Clothing Store <span class="admin-label">Admin</span></a><div class="admin-account"><span data-admin-account>Admin account</span><button class="button button-small button-outline" data-admin-logout>Log out</button></div></div></header><main class="admin-main"><div class="container"><div class="settings-heading"><div><p class="eyebrow">Shipping configuration</p><h1>Custom Couriers</h1><p class="muted">Configure your own courier services and customer pricing without an API. The existing packing engine determines the final parcel type, weight and dimensions.</p></div><a class="button button-outline" href="./index.html">Back to Shipping</a></div><section class="settings-panel"><div class="settings-actions"><a class="button button-primary" href="./custom-courier.html">Add Custom Courier</a></div><div class="admin-sections" data-list></div><p class="settings-load-status" data-status>Loading…</p></section></div></main><script>
async function getToken(){for(let i=0;i<50;i++){if(typeof window.getAdminIdToken==='function'){try{const t=await window.getAdminIdToken();if(t)return t;}catch(e){}}await new Promise(r=>setTimeout(r,200));}throw Error('Authentication required.');}
async function api(u,o={}){const h=new Headers(o.headers||{});h.set('Authorization','Bearer '+await getToken());if(o.body)h.set('Content-Type','application/json');const r=await fetch(u,{...o,headers:h}),p=await r.json().catch(()=>({}));if(!r.ok||!p.success)throw Error(p.error||'Request failed.');return p;}
const list=document.querySelector('[data-list]'),status=document.querySelector('[data-status]'),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function load(){try{const p=await api('/api/shipping?include_disabled=1'),methods=(p.data||[]).filter(m=>m.provider_type==='custom'&&m.custom_courier);list.innerHTML=methods.map(m=>{const c=m.custom_courier;return '<section class="admin-panel"><div><h2>'+esc(m.name)+'</h2><p class="muted">'+esc(c.description||'')+' · '+esc(c.calculation_mode)+' · '+(Number(m.is_enabled)?'Enabled':'Disabled')+'</p><p class="muted">'+(c.rates||[]).map(r=>esc(r.service_name)+' · '+esc(r.packaging_type||'any')+' · '+(r.min_weight_kg??'0')+'–'+(r.max_weight_kg??'∞')+' kg · ZAR '+Number(r.price).toFixed(2)).join('<br>')+'</p></div><div class="settings-actions"><a class="button button-outline" href="./custom-courier.html?id='+encodeURIComponent(m.id)+'">Edit</a></div></section>';}).join('')||'<p class="muted">No custom couriers configured yet.</p>';status.textContent='Custom couriers loaded.';}catch(e){status.textContent=e.message;}}
load();
</script>
