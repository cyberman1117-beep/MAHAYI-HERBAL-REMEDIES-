<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shipping Types | Clothing Store Admin</title><link rel="stylesheet" href="../../assets/css/styles.css"><script type="module" src="../../assets/js/firebase-auth.js"></script><script src="../../assets/js/site.js" defer></script></head><body class="admin-page"><header class="admin-header"><div class="container header-inner"><a class="brand" href="../../index.html">Clothing Store <span class="admin-label">Admin</span></a><div class="admin-account"><span data-admin-account>Admin account</span><button class="button button-small button-outline" data-admin-logout>Log out</button></div></div></header><main class="admin-main"><div class="container"><div class="settings-heading"><div><p class="eyebrow">Shipping configuration</p><h1>Shipping Types</h1><p class="muted">Define the shipping classifications used by products.</p></div><a class="button button-outline" href="./index.html">Back to Shipping</a></div><section class="settings-panel"><div class="admin-sections" data-list></div><form class="settings-form" data-form><div class="settings-fields settings-fields-two"><label class="field"><span>Type name</span><input name="name" required maxlength="80"></label><label class="field"><span>Code</span><input name="code" maxlength="80"></label><label class="field field-wide"><span>Description</span><input name="description" maxlength="300"></label><label class="field"><span><input name="requires_weight" type="checkbox" checked> Require shipping weight</span></label><label class="field"><span><input name="requires_dimensions" type="checkbox"> Require packed dimensions</span></label></div><div class="settings-actions"><span class="settings-load-status" data-status>Ready.</span><button class="button button-primary">Add shipping type</button></div></form></section></div></main><script>
async function getToken(){for(let i=0;i<50;i++){if(typeof window.getAdminIdToken==='function'){try{const t=await window.getAdminIdToken();if(t)return t;}catch(e){}}await new Promise(r=>setTimeout(r,200));}throw Error('Authentication required.');}async function api(u,o={}){const h=new Headers(o.headers||{});h.set('Authorization','Bearer '+await getToken());if(o.body)h.set('Content-Type','application/json');const r=await fetch(u,{...o,headers:h}),p=await r.json().catch(()=>({}));if(!r.ok||!p.success)throw Error(p.error||'Request failed.');return p;}const list=document.querySelector('[data-list]'),form=document.querySelector('[data-form]'),status=document.querySelector('[data-status]');const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){try{const p=await api('/api/shipping?include_disabled=1'),a=p.shipping_types||[];list.innerHTML=a.map(t=>'<section class="admin-panel"><div><h2>'+esc(t.name)+'</h2><p class="muted">'+esc(t.description||'')+' · '+(Number(t.requires_weight)?'Weight':'No weight')+' · '+(Number(t.requires_dimensions)?'Dimensions':'No dimensions')+' · '+(Number(t.is_enabled)?'Enabled':'Disabled')+'</p></div><button class="button button-outline" data-id="'+t.id+'">'+(Number(t.is_enabled)?'Disable':'Enable')+'</button></section>').join('')||'<p class="muted">No shipping types configured.</p>';}catch(e){status.textContent=e.message;}}list.addEventListener('click',async e=>{const id=e.target.closest('[data-id]')?.dataset.id;if(!id)return;const p=await api('/api/shipping?include_disabled=1'),t=(p.shipping_types||[]).find(x=>String(x.id)===String(id));try{await api('/api/shipping?resource=type&id='+id,{method:'PUT',body:JSON.stringify({is_enabled:Number(t.is_enabled)!==1})});load();}catch(x){status.textContent=x.message;}});form.addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/shipping',{method:'POST',body:JSON.stringify({resource:'type',name:form.elements.name.value.trim(),code:form.elements.code.value.trim(),description:form.elements.description.value.trim(),requires_weight:form.elements.requires_weight.checked,requires_dimensions:form.elements.requires_dimensions.checked,is_enabled:true})});form.reset();form.elements.requires_weight.checked=true;status.textContent='Shipping type added.';load();}catch(x){status.textContent=x.message;}});load();
</script></body></html>
