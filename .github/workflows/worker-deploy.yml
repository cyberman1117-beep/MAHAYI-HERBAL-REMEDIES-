name: Deploy MAHAYI HERBAL REMEDIES Worker

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "migrations/**"
      - "wrangler.toml"
      - ".github/workflows/worker-deploy.yml"
  workflow_dispatch:

concurrency:
  group: mahayi-herbal-remedies-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply mahayi-herbal-remedies-db --remote --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
